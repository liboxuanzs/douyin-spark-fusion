# 融合版抖音续火花的日志轮转（F8）。
#
# 落盘方式：两个 systemd 单元（web / daily）都把 stdout+stderr **追加**到
# /opt/douyin-spark-fusion/logs/douyin-spark-fusion.log —— 也就是 .env 里的
# OPS_LOG_FILE（面板"日志"页读的就是它）。
# 生产默认 LOG_LEVEL=Debug，一天一轮下来文件长得很快，所以必须轮转。
#
# 安装：cp deploy/logrotate.conf /etc/logrotate.d/douyin-spark-fusion
#      （deploy/install.sh 会自动装）
# 自测：logrotate -d /etc/logrotate.d/douyin-spark-fusion     # -d = 只演练不真做
#       logrotate -f /etc/logrotate.d/douyin-spark-fusion     # 强制轮转一次
#
# ★ 用 copytruncate 而不是 create：进程是 systemd 拉起来的、**不会**重开日志文件，
#   不 copytruncate 的话轮转后进程还在往被改名走的旧 inode 里写，
#   新文件永远是空的 —— 表现就是"面板日志页突然不更新了"。
/opt/douyin-spark-fusion/logs/*.log {
    daily
    rotate 14
    maxsize 32M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
